name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: List simulators
        run: xcrun simctl list devices available | head -40

      - name: Build & test (iOS Simulator)
        run: |
          set -eo pipefail
          DESTINATION="${CI_DESTINATION:-platform=iOS Simulator,name=iPhone 15}"
          xcodebuild -project HitStudio.xcodeproj -scheme HitStudio -destination "$DESTINATION" -quiet test CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: SwiftLint
        run: |
          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint lint --reporter github-actions-logging
          else
            echo "SwiftLint not installed on runner; skipping."
          fi
