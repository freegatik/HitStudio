included:
  - HitStudio
  - HitStudioTests
  - HitStudioUITests

excluded:
  - HitStudio.xcodeproj
  - DerivedData

disabled_rules:
  - trailing_whitespace
  - function_parameter_count
  - for_where
  - large_tuple
  - shorthand_operator
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - closure_spacing
  - explicit_init
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_first_last

line_length:
  ignores_urls: true
  warning: 330
  error: 400

function_body_length:
  warning: 120
  error: 200

type_body_length:
  warning: 500
  error: 800

file_length:
  warning: 600
  error: 1000

identifier_name:
  min_length: 1

type_name:
  min_length: 3

cyclomatic_complexity:
  warning: 15
  error: 25

reporter: xcode
